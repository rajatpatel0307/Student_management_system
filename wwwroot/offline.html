<main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11.5 12 6l9 5.5-9 5.5-9-5.5Z"/><path d="M7 14.2v3.1c2.8 2.2 7.2 2.2 10 0v-3.1M21 11.5V17"/></svg>
